name: Build MD AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zip \
            unzip

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.5.0"
          pip install "cython<3"

      - name: Nettoyer Buildozer
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Installer Android SDK et AIDL
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> "$GITHUB_ENV"

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip

          cp -r cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Verifier AIDL
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          AIDL="$ANDROID_HOME/build-tools/33.0.2/aidl"

          echo "SDK utilisé : $ANDROID_HOME"
          echo "AIDL trouvé : $AIDL"

          test -f "$AIDL"

          echo "AIDL est bien installé."

      - name: Construire MD AI
        run: |
          buildozer android debug

      - name: Recuperer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-AI-APK
          path: bin/*.apk
