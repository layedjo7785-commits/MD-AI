name: Build MD AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zip \
            unzip \
            wget

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.5.0"
          pip install "cython<3"

      - name: Nettoyer Buildozer
        run: |
          rm -rf "$HOME/.buildozer"
          rm -rf ".buildozer"

      - name: Installer Android SDK
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -r cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          mkdir -p "$ANDROID_HOME/tools/bin"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

      - name: Verifier SDK
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"

          echo "sdkmanager :"
          ls -l "$ANDROID_HOME/tools/bin/sdkmanager"

          echo "AIDL :"
          ls -l "$ANDROID_HOME/build-tools/33.0.2/aidl"

          test -x "$ANDROID_HOME/tools/bin/sdkmanager"
          test -f "$ANDROID_HOME/build-tools/33.0.2/aidl"

      - name: Construire MD AI
        run: |
          buildozer android debug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-AI-APK
          path: bin/*.apk
