name: Build MD AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zip \
            unzip \
            openjdk-17-jdk

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.5.0"
          pip install "cython<3"

      - name: Nettoyer ancien environnement Buildozer
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Construire MD AI
        run: |
          buildozer android debug

      - name: Recuperer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-AI-APK
          path: bin/*.apk
